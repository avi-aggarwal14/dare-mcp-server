name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Alias version lockstep
        run: node scripts/sync-alias.mjs --check
      - name: Setup + store unit tests
        run: node scripts/setup-test.mjs
      - name: Smoke test (stdio, no credentials)
        run: node scripts/smoke.mjs
